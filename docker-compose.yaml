services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports: 
      - "21503:5432"
    volumes: 
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cicd-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "21501:21501"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PORT=21501
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:21501/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cicd-network

volumes:
  pgdata:

networks:
  cicd-network:
    name: cicd-network
    driver: bridge