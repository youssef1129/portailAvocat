# HTTP — serves ACME challenges, redirects everything else to HTTPS.
server {
    listen 80;
    server_name youssef-maazouz.stage2-div.rayan-drissi.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
