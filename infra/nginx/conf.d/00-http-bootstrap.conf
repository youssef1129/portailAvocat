# HTTP bootstrap — ACME challenge only (no HTTPS redirect until certs exist).
server {
    listen 80;
    server_name youssef-maazouz.stage2-div.rayan-drissi.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'TLS not configured yet. Run: make certs-staging && make enable-ssl\n';
        add_header Content-Type text/plain;
    }
}
